<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#070D1E"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <linearGradient id="bookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <linearGradient id="bookRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#39FF14"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bgGrad)" stroke="url(#cyberBorder)" stroke-width="5" />
  
  <!-- Subtle Circuit Dots -->
  <circle cx="28" cy="28" r="3.5" fill="#00F0FF" opacity="0.8"/>
  <circle cx="100" cy="28" r="3.5" fill="#39FF14" opacity="0.8"/>
  <line x1="28" y1="28" x2="42" y2="28" stroke="#00F0FF" stroke-width="2" stroke-dasharray="2 2" opacity="0.5"/>
  <line x1="86" y1="28" x2="100" y2="28" stroke="#39FF14" stroke-width="2" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- Left Book Wing -->
  <path d="M64 42 C52 33, 28 35, 24 37 C22 37.5, 21 39.5, 21 42 L21 84 C21 86, 23 87.5, 25 87 C30 85.5, 52 84, 64 93 Z" 
        fill="url(#bookLeft)" 
        filter="url(#neonGlow)"/>

  <!-- Right Book Wing -->
  <path d="M64 42 C76 33, 100 35, 104 37 C106 37.5, 107 39.5, 107 42 L107 84 C107 86, 105 87.5, 103 87 C98 85.5, 76 84, 64 93 Z" 
        fill="url(#bookRight)" 
        filter="url(#neonGlow)"/>

  <!-- Center Energy Spine / Lightning Bolt -->
  <path d="M68 28 L56 60 L67 60 L57 92 L76 54 L65 54 Z" 
        fill="#FFFFFF" 
        stroke="#00F0FF" 
        stroke-width="1.5"
        filter="url(#neonGlow)"/>
</svg>
